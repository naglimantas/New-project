# Checks every push: web tests, build and end-to-end checks on Linux; Rust tests (including the
# Windows calls on real processes) and a Windows build of the app.
name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Install Chromium for the end-to-end checks
        run: npx playwright-core install --with-deps chromium
      - name: End-to-end checks (builds first)
        run: npm run e2e
      - name: Keep screenshots of failed checks
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failures
          path: e2e/fail-*.png
          if-no-files-found: ignore

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run build
      - name: Rust tests (with the Windows calls on real processes)
        working-directory: src-tauri
        run: cargo test -- --nocapture
