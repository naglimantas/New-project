# Builds the Windows installer and attaches it to a GitHub release.
#
#   Release:  bump "version" in package.json and src-tauri/Cargo.toml, commit, then  git tag v1.2.3 && git push --tags
#   Test run: Actions tab -> "Build & release" -> Run workflow (builds only, the installer is under Artifacts)
name: Build & release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - id: v
        name: Read version (and check it matches the tag)
        shell: bash
        run: |
          V=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $V"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm test
      - run: npx tauri build
      - name: Collect installer
        shell: bash
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/nsis/*.exe "out/Modes-${{ steps.v.outputs.version }}-setup.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: out/*.exe
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Modes ${{ needs.windows.outputs.version }}
          files: out/*
          body: |
            **Windows:** download `Modes-${{ needs.windows.outputs.version }}-setup.exe` and run it (per-user install, no admin). If SmartScreen warns, click *More info → Run anyway*.
